<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Marks that JavaScript is running, before first paint, so the
         build-time fallback list in this page can hide itself without a
         flash. See vite-prerender.js and .prerender-only in globals.css. -->
    <script>document.documentElement.classList.add("js");</script>
    <title>ნამუშევრები | Lumine | შემოქმედებითი სააგენტო — თბილისი</title>
    <meta name="author" content="Lumine" />
    <meta
      name="description"
      content="რას აშენებს Lumine: ფოტოგრაფია, ვიდეო, გრაფიკული დიზაინი, სოციალური, მარკეტინგი და ვები."
    />
    <meta name="theme-color" content="#17130f" />
    <meta property="og:title" content="ნამუშევრები — Lumine" />
    <meta
      property="og:description"
      content="არქივი: ფოტოგრაფია, ვიდეო, დიზაინი, სოციალური, მარკეტინგი და ვები."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo/lumine-logo-black.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-mark.svg" />
    <link rel="icon" type="image/png" href="/icons/favicon-mark.png" />
    <link rel="canonical" href="https://lumine.ge/ka/work" />
    <link rel="alternate" hreflang="en" href="https://lumine.ge/work" />
    <link rel="alternate" hreflang="ka" href="https://lumine.ge/ka/work" />
    <link rel="alternate" hreflang="x-default" href="https://lumine.ge/work" />
    <link rel="stylesheet" href="/css/globals.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/work.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/chat-widget.css" />
  </head>
  <body>
    <!-- work: navigation -->
    <nav>
      <div class="nav-logo">
        <a href="/ka">
          <img src="/logo/lumine-wordmark.svg" alt="Lumine" decoding="async" />
        </a>
      </div>
      <div class="nav-icon">
        <img src="/logo/lumine-mark-2.svg" alt="" decoding="async" />
      </div>
      <div class="nav-right">
        <div class="nav-lang" role="group" aria-label="Language">
          <a href="/work" class="nav-lang-btn">EN</a>
          <span class="nav-lang-sep">/</span>
          <span class="nav-lang-btn is-active">GE</span>
        </div>
        <div class="nav-toggler">
          <p>Menu</p>
        </div>
      </div>
    </nav>

    <!-- work: header — the archive's cover plate -->
    <header class="work-hero">
      <div class="container work-hero-top">
        <div class="work-hero-title">
          <p class="eyebrow">პორტფოლიო — ფირფიტების კატალოგი</p>
          <h1
            data-animate-variant="slide-words"
            data-animate-on-scroll="false"
            data-animate-delay="0.3"
          >
            არქივი
          </h1>
        </div>
        <!-- the archive described by its own numbers, not by adjectives -->
        <dl class="work-tally" id="workTally" aria-label="არქივი ერთი შეხედვით"></dl>
      </div>
    </header>

    <!-- work: filters + view toggle (sticks while the plates scroll) -->
    <div class="work-filters" id="workFilters">
      <div class="container work-filters-inner">
        <div class="filter-rows">
          <div class="filter-group" data-filter-group="type">
            <span class="filter-label">ტიპი</span>
            <div class="filter-tabs" id="typeFilters" role="group" aria-label="ტიპით ფილტრაცია"></div>
          </div>
          <div class="filter-group" data-filter-group="industry">
            <span class="filter-label">ინდუსტრია</span>
            <div class="filter-tabs" id="industryFilters" role="group" aria-label="ინდუსტრიით ფილტრაცია"></div>
          </div>
        </div>
        <div class="work-filters-foot">
          <p class="work-count" id="workCount" aria-live="polite" aria-atomic="true">
            22 / 22 — ყველა ტიპი, ყველა ინდუსტრია
          </p>
          <div class="work-views" role="group" aria-label="ხედი">
            <button type="button" class="work-view is-active" data-view="plates" aria-pressed="true">ფირფიტები</button>
            <button type="button" class="work-view" data-view="index" aria-pressed="false">საძიებელი</button>
            <button type="button" class="work-reset" id="workReset" hidden>გასუფთავება ✕</button>
          </div>
        </div>
      </div>
    </div>

    <!-- work: grid -->
    <main class="work-main">
      <div class="container">
        <div class="work-grid" id="workGrid"></div>
        <div class="work-empty" id="workEmpty" hidden>
          <h5>აქ ჯერ არაფერია</h5>
          <p>ეს კომბინაცია თავის პირველ პროექტს ელოდება.</p>
          <a href="/ka/contact" class="btn btn-outline">დაიწყე ჩვენთან ერთად</a>
        </div>
      </div>
    </main>

    <!-- work: footer -->
    <footer>
      <div id="footer-canvas"></div>
      <div class="footer-inner">
        <div class="footer-cta">
          <span
            class="footer-cta-eyebrow"
            data-animate-variant="slide"
            data-animate-on-scroll="true"
          >
            გისმენთ
          </span>
          <h3
            class="footer-cta-heading"
            data-animate-variant="slide"
            data-animate-on-scroll="true"
            data-animate-delay="0.1"
          >
            თქვენი შემდეგი დიდი საქმე სწორედ აქედან იწყება
          </h3>
        </div>
        <div class="footer-bottom">
          <p class="footer-logo">Lumine</p>
          <p class="footer-copy">თბილისი, საქართველო</p>
        </div>
      </div>
    </footer>

    <script type="module" src="/js/lenis-scroll.js"></script>
    <script type="module" src="/js/cursor.js"></script>
    <script type="module" src="/js/mtavruli.js"></script>
    <script type="module" src="/js/animated-copy.js"></script>
    <script type="module" src="/js/simulation.js"></script>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/work.js"></script>
    <script type="module" src="/js/footer.js"></script>
    <script type="module" src="/js/chat-widget.js"></script>
  </body>
</html>
